name: PHP syntax check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Check PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find apsib -type f -name '*.php' -print0 | while IFS= read -r -d '' file; do
            echo "Checking $file"
            php -l "$file"
          done
