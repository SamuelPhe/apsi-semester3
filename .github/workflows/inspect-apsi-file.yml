name: Inspect APSI binary (temporary)
on:
  push:
    branches:
      - inspect-apsi-file
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Inspect and extract first-party source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile, hashlib, re, io

          p = Path("apsi final 23012026")
          out = Path("apsi-inspection")
          out.mkdir(exist_ok=True)
          report = []
          if not p.exists():
              report.append("FILE_NOT_FOUND")
          else:
              raw = p.read_bytes()
              report += [
                  f"name: {p.name}",
                  f"size_bytes: {len(raw)}",
                  f"sha256: {hashlib.sha256(raw).hexdigest()}",
              ]
              with zipfile.ZipFile(io.BytesIO(raw)) as z:
                  infos = z.infolist()
                  report.append(f"archive_entries: {len(infos)}")
                  report.append(f"archive_uncompressed_bytes: {sum(i.file_size for i in infos)}")
                  selected = []
                  allowed = {".php", ".js", ".css", ".html", ".htm", ".json", ".md", ".txt", ".xml"}
                  excluded = ("apsib/dompdf/", "apsib/lib/", "apsib/scss/bootstrap/", "apsib/img/", "apsib/Icon/")
                  source_dir = out / "source"
                  for info in infos:
                      name = info.filename
                      if not name.startswith("apsib/") or name.endswith("/") or name.startswith(excluded):
                          continue
                      suffix = Path(name).suffix.lower()
                      if suffix in allowed:
                          target = source_dir / Path(name).relative_to("apsib")
                          target.parent.mkdir(parents=True, exist_ok=True)
                          target.write_bytes(z.read(info))
                          selected.append((name, info.file_size))
                  sql_name = "apsib/edusched fix 2.sql"
                  if sql_name in z.namelist():
                      sql = z.read(sql_name).decode("utf-8", "replace")
                      ddl = re.findall(r"(?:CREATE TABLE|CREATE DATABASE|ALTER TABLE).*?;", sql, flags=re.I | re.S)
                      db_dir = source_dir / "database"
                      db_dir.mkdir(parents=True, exist_ok=True)
                      (db_dir / "schema-only.sql").write_text("\n\n".join(ddl), encoding="utf-8")
                      selected.append(("database/schema-only.sql (DDL only; no INSERT data)", sum(map(len, ddl))))
                  report.append("first_party_files_extracted:")
                  for name, size in selected:
                      report.append(f"{size:>10}  {name}")
                  report.append(f"first_party_file_count: {len(selected)}")
                  source_zip = out / "apsi-source.zip"
                  with zipfile.ZipFile(source_zip, "w", zipfile.ZIP_DEFLATED) as dest:
                      for file in source_dir.rglob("*"):
                          if file.is_file():
                              dest.write(file, file.relative_to(source_dir).as_posix())
                  report.append(f"source_bundle_bytes: {source_zip.stat().st_size}")
          (out / "report.txt").write_text(chr(10).join(report), encoding="utf-8")
          print(chr(10).join(report[:50]))
          PY
      - name: Upload inspection and source bundle
        uses: actions/upload-artifact@v4
        with:
          name: apsi-source-inspection
          path: |
            apsi-inspection/report.txt
            apsi-inspection/apsi-source.zip
          if-no-files-found: error
          retention-days: 2
